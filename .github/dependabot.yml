# Keeps the pinned GitHub Actions current. Every `uses:` line is pinned to a full commit SHA with the
# version in a trailing comment; Dependabot bumps both, and the pull request checks run on each update.
# One grouped pull request a week, so action updates do not arrive one by one.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"
